services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app.dev
    ports:
      - '8000:5000'
    depends_on:
      - db
    environment:
      - MONGO_URI=mongodb://mongo:27017/mydatabase

  db:
    build:
      context: .
      dockerfile: Dockerfile.db.dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
volumes:
  mongo_data:
